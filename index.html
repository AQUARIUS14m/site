<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>ReYMooN & ReYMooD</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: radial-gradient(circle at top, #1e1338 0%, #0a0812 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f5f5f7;
      --sub: #a1a1aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    body {
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .container {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 22px;
      text-align: center;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #c084fc, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { font-size: 13px; color: var(--sub); margin-bottom: 20px; }
    .roles-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .role-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 18px 10px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .role-btn.moon { border-color: rgba(168, 85, 247, 0.4); }
    .role-btn.mood { border-color: rgba(251, 146, 60, 0.4); }
    .role-icon { font-size: 28px; }
    .role-name { font-weight: 700; font-size: 15px; }
    textarea {
      width: 100%;
      height: 90px;
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      resize: none;
      margin-bottom: 12px;
    }
    .actions { display: flex; flex-direction: column; gap: 8px; }
    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary { background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%); color: white; }
    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
  </style>
</head>
<body>
  <div class="container">
    <h1>مچ دونفره 🌙 ☀️</h1>
    <p class="subtitle">عملیات مورد نظرت رو انتخاب کن</p>

    <!-- انتخاب نقش -->
    <div class="roles-grid">
      <button class="role-btn moon" onclick="sendAction('pick_role', {role: 'ReYMooN'})">
        <span class="role-icon">🌙</span>
        <span class="role-name">انتخاب ReYMooN</span>
      </button>

      <button class="role-btn mood" onclick="sendAction('pick_role', {role: 'ReYMooD'})">
        <span class="role-icon">☀️</span>
        <span class="role-name">انتخاب ReYMooD</span>
      </button>
    </div>

    <!-- فرم پاسخ -->
    <textarea id="answer-input" placeholder="پاسخ سوال فعلی رو اینجا بنویس..."></textarea>
    
    <div class="actions">
      <button class="btn btn-primary" onclick="submitAnswer()">ارسال جواب به گروه 💌</button>
      <button class="btn btn-secondary" onclick="sendAction('skip_question')">رد کردن سوال فعلی ⏭</button>
      <button class="btn btn-danger" onclick="sendAction('end_match')">اتمام مچ 🛑</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    function sendAction(action, payload = {}) {
      if (tg) {
        tg.sendData(JSON.stringify({ action, ...payload }));
        tg.close();
      } else {
        alert("لطفاً داخل تلگرام باز کنید.");
      }
    }

    function submitAnswer() {
      const text = document.getElementById("answer-input").value.trim();
      if (!text) return;
      sendAction("submit_answer", { answer: text });
    }
  </script>
</body>
</html>
