<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>واژه‌ساز تیمی سروش</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <!-- بخش ۱: لابی و انتخاب مود -->
  <div id="screen-lobby" class="screen active">
    <div class="card">
      <h2>🏆 واژه‌ساز آنلاین</h2>
      <p class="subtitle">حالت بازی را انتخاب کنید</p>

      <div class="mode-select">
        <button id="btn-mode-1v1" class="btn active">دو نفره (1 vs 1)</button>
        <button id="btn-mode-2v2" class="btn">تیمی (2 vs 2)</button>
      </div>

      <div class="input-group">
        <input type="text" id="input-room" placeholder="کد اتاق (اختیاری برای ساخت/پیوستن)">
      </div>

      <button id="btn-join" class="btn-primary">شروع و ورود به اتاق</button>
    </div>
  </div>

  <!-- بخش ۲: اتاق انتظار -->
  <div id="screen-waiting" class="screen">
    <div class="card">
      <h3>اتاق: <span id="display-room-id">---</span></h3>
      <div id="team-assignment" class="teams-grid">
        <div class="team-box" id="team-a-box">
          <h4>تیم ۱</h4>
          <ul id="team-a-list"></ul>
          <button class="btn-small" onclick="switchTeam('teamA')">عضویت در تیم ۱</button>
        </div>
        <div class="team-box" id="team-b-box">
          <h4>تیم ۲</h4>
          <ul id="team-b-list"></ul>
          <button class="btn-small" onclick="switchTeam('teamB')">عضویت در تیم ۲</button>
        </div>
      </div>
      <button id="btn-start" class="btn-primary mt-20" disabled>شروع رقابت</button>
    </div>
  </div>

  <!-- بخش ۳: صحنه اصلی بازی -->
  <div id="screen-game" class="screen">
    <div class="game-header">
      <div class="timer" id="timer">۶۰</div>
      <div class="score-board">
        <span class="score-item">تیم ۱: <b id="score-a">۰</b></span>
        <span class="score-divider">|</span>
        <span class="score-item">تیم ۲: <b id="score-b">۰</b></span>
      </div>
    </div>

    <!-- حروف راند -->
    <div class="letters-board" id="letters-container"></div>

    <!-- فرم ارسال کلمه -->
    <form id="word-form" onsubmit="submitWord(event)">
      <input type="text" id="word-input" autocomplete="off" placeholder="کلمه را بنویسید..." />
      <button type="submit" class="btn-submit">ثبت</button>
    </form>

    <!-- تاریخچه کلمات کشف شده -->
    <div class="word-feed">
      <h4>کلمات ثبت‌شده اخیر:</h4>
      <div id="word-logs" class="logs-container"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
